name: One-off AK source fix

on:
  push:
    paths:
      - .github/workflows/ak-source-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bake AK pose into source and remove runtime override
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path("public/index.html")
          text = index.read_text()
          ak_pattern = re.compile(
              r"(ak74u:\{file:'ak47',length:\.95,grip:\[\.002,-\.105,\.305\],support:\[-\.003,-\.052,-\.190\],\s*sightX:-\.0026,sightY:\.046,)(hipDrop:\.034\},)"
          )
          text, ak_count = ak_pattern.subn(r"\1hip:[.395,-.285,-.545],\2", text, count=1)
          if ak_count != 1:
              raise SystemExit(f"Expected exactly one AK source block, found {ak_count}")
          index.write_text(text)

          worker = Path("src/index.js")
          text = worker.read_text()
          worker_pattern = re.compile(
              r"    // Temporary live tuning pass for the AK viewmodel\.[\s\S]*?    return new Response\(tunedHtml, \{ status: response\.status, statusText: response\.statusText, headers \}\);"
          )
          text, worker_count = worker_pattern.subn(
              "    return new Response(themedHtml, { status: response.status, statusText: response.statusText, headers });",
              text,
              count=1,
          )
          if worker_count != 1:
              raise SystemExit(f"Expected exactly one temporary Worker override, found {worker_count}")
          worker.write_text(text)
          PY

      - name: Remove one-off workflow
        run: rm .github/workflows/ak-source-fix.yml

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html src/index.js .github/workflows/ak-source-fix.yml
          git commit -m "Bake AK hip-fire pose into source"
          git push