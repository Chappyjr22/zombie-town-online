name: One-off AK viewmodel tuning

on:
  push:
    paths:
      - .github/workflows/ak-viewmodel-tuning.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tune AK hip-fire placement and yaw
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("public/index.html")
          text = path.read_text()

          old_ak = "  ak74u:{file:'ak47',length:.95,grip:[.002,-.105,.305],support:[-.003,-.052,-.190],\n    sightX:-.0026,sightY:.046,hip:[.395,-.285,-.545],hipDrop:.034},"
          new_ak = "  ak74u:{file:'ak47',length:.95,grip:[.002,-.105,.305],support:[-.003,-.052,-.190],\n    sightX:-.0026,sightY:.046,hip:[.385,-.295,-.595],hipYaw:.035,hipDrop:.034},"
          if text.count(old_ak) != 1:
              raise SystemExit(f"Expected one AK config block, found {text.count(old_ak)}")
          text = text.replace(old_ak, new_ak, 1)

          old_load = "    d.sourceViewDrop=cfg.hipDrop||0;\n    if(cfg.hip)d.hip.set(cfg.hip[0],cfg.hip[1],cfg.hip[2]);"
          new_load = "    d.sourceViewDrop=cfg.hipDrop||0;\n    d.sourceHipYaw=cfg.hipYaw||0;\n    if(cfg.hip)d.hip.set(cfg.hip[0],cfg.hip[1],cfg.hip[2]);"
          if text.count(old_load) != 1:
              raise SystemExit(f"Expected one sourced weapon load block, found {text.count(old_load)}")
          text = text.replace(old_load, new_load, 1)

          old_rot = "    lerp(-0.07,0,d.adsMix)+d.sprintMix*0.62,"
          new_rot = "    lerp(-0.07+(d.sourceHipYaw||0),0,d.adsMix)+d.sprintMix*0.62,"
          if text.count(old_rot) != 1:
              raise SystemExit(f"Expected one viewmodel yaw line, found {text.count(old_rot)}")
          text = text.replace(old_rot, new_rot, 1)

          path.write_text(text)
          PY

      - name: Remove one-off workflow
        run: rm .github/workflows/ak-viewmodel-tuning.yml

      - name: Commit AK tuning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/ak-viewmodel-tuning.yml
          git commit -m "Refine AK hip-fire placement and yaw"
          git push
